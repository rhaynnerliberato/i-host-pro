<h2 mat-dialog-title>{{ data.titleKey | transloco }}</h2>
<mat-dialog-content>{{ data.messageKey | transloco: (data.messageParams ?? {}) }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ 'common.cancel' | transloco }}</button>
  <button mat-flat-button color="warn" (click)="confirm()">{{ (data.confirmKey ?? 'common.confirm') | transloco }}</button>
</mat-dialog-actions>
