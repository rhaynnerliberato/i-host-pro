# OpenTelemetry Collector — recebe telemetria via OTLP das aplicações
# (IHostPro.Api, IHostPro.Worker) e expõe métricas em formato Prometheus
# para scrape. Ver ADR-007 (Observabilidade) e ADR-001.
#
# Pipeline: Aplicações -> OTLP -> OpenTelemetry Collector -> Prometheus -> Grafana

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Expõe um endpoint de scrape no formato Prometheus (componente do Collector,
  # distinto do pacote .NET "OpenTelemetry.Exporter.Prometheus.AspNetCore", que
  # nunca teve versão estável — ver ADR-007).
  prometheus:
    endpoint: 0.0.0.0:8889

  # Fase 12, Checkpoint 2 — fecha o item pendente do ADR-007: traces agora são
  # encaminhados a um backend real (Grafana Tempo, resolução via nome de
  # serviço do próprio docker-compose), não apenas registrados/descartados.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
