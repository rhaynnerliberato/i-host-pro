name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    # A raiz do código-fonte é o subdiretório i-host-pro/ (Documento 99);
    # a raiz do repositório Git é o workspace inteiro.
    working-directory: i-host-pro

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore IHostPro.sln

      - name: Build
        run: dotnet build IHostPro.sln --no-restore --configuration Release

      - name: Architecture Tests
        run: dotnet test tests/IHostPro.ArchitectureTests/IHostPro.ArchitectureTests.csproj --no-build --configuration Release -m:1 --logger "trx"

      - name: Identity & Access - Unit Tests
        run: dotnet test tests/Contexts/Identity/IHostPro.Contexts.Identity.Tests.Unit/IHostPro.Contexts.Identity.Tests.Unit.csproj --no-build --configuration Release -m:1 --logger "trx"

      # Requires Docker (Testcontainers.PostgreSql/Testcontainers.Redis) —
      # available by default on GitHub-hosted ubuntu-latest runners.
      #
      # -m:1 (MSBuild maxcpucount=1, serializing this invocation) together
      # with this project's own xunit.runner.json
      # ("parallelizeTestCollections": false) prevent the many PostgreSQL/
      # Redis containers this suite's test classes each spin up via
      # IAsyncLifetime from starting concurrently — running them at once was
      # observed to intermittently overwhelm the Docker daemon's exec/
      # health-check polling (a transient DotNet.Testcontainers/Docker.DotNet
      # exception on an otherwise-unrelated test, not a code defect —
      # Incremento 2 plan, Etapa 13). Every test still runs and is asserted;
      # this only removes concurrency between test classes, it does not skip
      # or weaken any of them.
      - name: Identity & Access - Integration Tests
        run: dotnet test tests/Contexts/Identity/IHostPro.Contexts.Identity.Tests.Integration/IHostPro.Contexts.Identity.Tests.Integration.csproj --no-build --configuration Release -m:1 --logger "trx"

      # NOTE (Phase 0/1 scope): steps for additional Bounded Contexts, static
      # analysis and container image build will be added as those modules and
      # pipelines are implemented (ADR-011).
