name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    # A raiz do código-fonte é o subdiretório i-host-pro/ (Documento 99);
    # a raiz do repositório Git é o workspace inteiro.
    working-directory: i-host-pro

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore IHostPro.sln

      - name: Build
        run: dotnet build IHostPro.sln --no-restore --configuration Release

      - name: Architecture Tests
        run: dotnet test tests/IHostPro.ArchitectureTests/IHostPro.ArchitectureTests.csproj --no-build --configuration Release --logger "trx"

      # NOTE (Phase 0 scope): steps for unit/integration tests per Bounded Context,
      # static analysis and container image build will be added as those modules
      # and pipelines are implemented (ADR-011).
